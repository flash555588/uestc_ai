# http context. Treat configured origins as literals, never loose regexes.
map $request_method $uestc_write { default 0; POST 1; PUT 1; PATCH 1; DELETE 1; }
map $cookie_session_token $uestc_cookie { default 1; "" 0; }
map $http_origin $uestc_origin_ok {
    default 0;
    "" 1;
    "https://uestcai.top" 1;
    "https://www.uestcai.top" 1;
    "https://api.uestcai.top" 1;
}
map $http_authorization $uestc_bearer { default 0; "~^Bearer .+" 1; }
map $uri $uestc_api_path { default 0; ~^/(api/|v1/) 1; }
map "$uestc_write:$uestc_cookie:$uestc_origin_ok:$uestc_bearer:$uestc_api_path" $uestc_reject_write {
    default 0;
    "1:1:0:0:1" 1;
}
map $http_upgrade $uestc_connection_upgrade { default upgrade; "" close; }
map $host $uestc_known_host {
    default 0;
    uestcai.top 1;
    www.uestcai.top 1;
    api.uestcai.top 1;
}
